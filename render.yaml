services:
  - type: web
    name: dataco-dashboard
    runtime: python
    plan: free
    rootDir: dashboard
    buildCommand: python -m pip install -r backend/requirements-web.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
